[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
murmur-core = { path = "crates/murmur-core" }
murmur-audio = { path = "crates/murmur-audio" }
murmur-stt = { path = "crates/murmur-stt" }
murmur-llm = { path = "crates/murmur-llm" }
murmur-store = { path = "crates/murmur-store" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
