version: 2

# All version updates arrive as one pull request a week, across Rust, npm and
# GitHub Actions. Security fixes still open right away, one per advisory.
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
      day: monday

updates:
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
