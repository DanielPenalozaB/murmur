name: Set up toolchains
description: Node + pnpm, Rust, and the prebuilt sherpa-onnx library, shared by CI and releases.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
    # sherpa-onnx-sys downloads its prebuilt library into target/, which the Rust
    # cache prunes while keeping the build script's result, so linking later fails.
    # Keep the library outside target/ in its own cache instead.
    - name: Speaker model runtime version
      id: sherpa
      shell: bash
      run: echo "version=$(grep -A1 'name = "sherpa-onnx-sys"' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      with:
        path: ~/sherpa-onnx
        key: sherpa-onnx-${{ steps.sherpa.outputs.version }}-osx-arm64-static
    - name: Speaker model runtime
      shell: bash
      env:
        VERSION: ${{ steps.sherpa.outputs.version }}
      run: |
        name="sherpa-onnx-v$VERSION-osx-arm64-static-lib"
        if [ ! -d ~/sherpa-onnx/$name/lib ]; then
          mkdir -p ~/sherpa-onnx
          curl -fsSL "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$VERSION/$name.tar.bz2" | tar -xj -C ~/sherpa-onnx
        fi
        echo "SHERPA_ONNX_LIB_DIR=$HOME/sherpa-onnx/$name/lib" >> "$GITHUB_ENV"
    - shell: bash
      run: pnpm install --frozen-lockfile
