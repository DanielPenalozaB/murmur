name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Frontend checks (TypeScript, Biome)
        run: pnpm check
      - name: Frontend tests
        run: pnpm vitest run
      - name: Frontend build
        run: pnpm build
      - name: Capture helper (Swift)
        run: ./scripts/build-audiocap.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
