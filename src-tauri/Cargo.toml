[package]
name = "murmur"
description = "Local-first meeting transcription and notes"
version.workspace = true
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows.
name = "murmur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

murmur-core.workspace = true
murmur-audio.workspace = true
murmur-stt.workspace = true
murmur-llm.workspace = true
murmur-store.workspace = true
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "rustls"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
security-framework = "3.7.0"
